<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  h1 { color:#F2C14E; font-size:28px; margin:0 0 4px; }

<body><main>
  <h1>Achados do Crow 🛒</h1>
  <p class="sub">Viu o post no TikTok? Procure a mesma capa aqui. Os mais novos ficam em cima.</p>
  
  <p>Nenhum achado por enquanto. Segue o Crow!</p>
  
  <footer>Links de afiliado: o Crow pode ganhar uma comissão nas compras, sem custo extra para você.</footer>
